<input type="text" id="mandiSearch" placeholder="Sabzi khojo - jaise Tamatar, Pyaz, Aalu..." onkeyup="filterMandi()" style="width:90%;padding:10px;margin:10px;">

<div id="mandiResult"></div>

<script>
let allMandi = [];
async function checkMandi(){
  document.getElementById('mandiResult').innerHTML = "Bharat ki mandiyon se live bhav la raha hu...";
  const res = await fetch('https://kisansathi-ai-q9b0.onrender.com/api/mandi');
  const data = await res.json();
  allMandi = data.mandis;
  showMandi(allMandi);
}
function showMandi(list){
  let html = "";
  list.forEach(m=>{
    let star = m.isPramukh ? "⭐ PRAMUKH MANDI" : "";
    html += `<div style="border:1px solid #ccc;padding:10px;margin:8px;border-radius:8px;background:${m.isPramukh?'#fff8e1':'#fff'}">
      <b>${m.mandi} ${star}</b> - ${m.state||''}<br>
      🥦 <b>${m.fasal}</b> - ${m.bhav}<br>
      <small>${m.full} | ${m.date||''}</small>
    </div>`;
  });
  document.getElementById('mandiResult').innerHTML = html;
}
function filterMandi(){
  let q = document.getElementById('mandiSearch').value.toLowerCase();
  let filtered = allMandi.filter(m => m.fasal.toLowerCase().includes(q) || m.mandi.toLowerCase().includes(q));
  showMandi(filtered);
}
checkMandi(); // page khulte hi load
</script>
