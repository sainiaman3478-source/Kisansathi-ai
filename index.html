<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KisanSaathi AI - Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f0fdf4]">
<div class="bg-gradient-to-br from-green-600 to-green-800 text-white p-6 pb-10 rounded-b-[30px]"><h1 class="text-2xl font-bold">🌾 KisanSaathi AI</h1><span class="bg-white/20 px-3 py-1 rounded-full text-sm">LIVE - REAL AI</span></div>
<div class="mx-4 -mt-6 bg-white rounded-[20px] p-5 shadow-lg"><h2 class="font-bold">🌿 Fasal Ki Khad Puchho</h2><input id="khadInput" placeholder="Ganna me konsi khad dale?" class="w-full p-4 bg-gray-50 rounded-xl"><button onclick="askKhad()" class="w-full mt-3 bg-green-600 text-white p-4 rounded-xl font-bold">✨ Jankari Lo</button><div id="khadResult" class="mt-3 p-3 bg-green-50 rounded-xl text-sm hidden"></div></div>
<div class="mx-4 mt-4 bg-white rounded-[20px] p-5 shadow-lg"><h2 class="font-bold">📸 Rog Pehchan - Camera (REAL AI)</h2><input type="file" id="rogFile" accept="image/*" capture="environment" onchange="previewRog(this)" style="width:100%; margin:10px 0;"><div id="previewArea" class="hidden"><img id="rogPreviewImg" class="w-full h-52 object-cover rounded-xl"></div><button onclick="askRog()" id="rogBtn" class="w-full mt-3 bg-purple-600 text-white p-4 rounded-xl font-bold">🔍 Rog Jaancho - Asli AI</button><div id="rogResult" class="mt-3 p-4 bg-purple-50 rounded-xl text-sm hidden"></div></div>
<script>
const BACKEND_URL='https://kisansathi-ai-q9b0.onrender.com';
async function askKhad(){let q=document.getElementById('khadInput').value;if(!q)return;let box=document.getElementById('khadResult');box.classList.remove('hidden');box.innerHTML="⏳ Soch raha hu...";try{let r=await fetch(`${BACKEND_URL}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});let d=await r.json();box.innerHTML=d.reply.replace(/\n/g,"<br>");}catch(e){box.innerHTML="20 sec baad try karo, server jag raha hai";}}
function previewRog(input){if(input.files&&input.files[0]){document.getElementById('rogPreviewImg').src=URL.createObjectURL(input.files[0]);document.getElementById('previewArea').classList.remove('hidden');}}
async function askRog(){let file=document.getElementById('rogFile').files[0];let box=document.getElementById('rogResult');let btn=document.getElementById('rogBtn');if(!file){alert('Photo select karo');return;}box.classList.remove('hidden');box.innerHTML="⏳ AI photo dekh raha hai... (30 sec lag sakta hai)";btn.disabled=true;try{let fd=new FormData();fd.append('image',file);let r=await fetch(`${BACKEND_URL}/api/detect`,{method:'POST',body:fd});let d=await r.json();box.innerHTML="<b>🤖 Gemini Report:</b><br><br>"+d.result.replace(/\n/g,"<br>");}catch(e){box.innerHTML="Error: "+e.message+" - Dobara try karo";}finally{btn.disabled=false;}}
</script>
</body>
</html>
