<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jansath Mandi Bhav</title>
<style>
body{font-family:system-ui; background:#f5f7f0; margin:0; padding:15px}
.card{background:white; border:1.5px solid #a5d6a7; padding:16px; border-radius:14px; margin:12px 0; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px #0001}
.green{color:green; background:#e8f5e9; padding:3px 8px; border-radius:10px; font-size:12px}
</style>
</head>
<body>
<h2>🌲 Jansath Lakdi Bhav - LIVE</h2>
<p style="color:gray; font-size:13px">Rate Google Sheet se LIVE aa raha hai</p>
<div id="bhav-list">Loading...</div>

<script>
const SHEET_ID = "1HbtQAFCUWaoP3C6RSIGpw8E0p3tvf7mkSR0rY7mByDk";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;

async function loadBhav(){
  try{
    const res = await fetch(CSV_URL);
    const text = await res.text();
    const rows = text.split("\n").slice(1); // pehli line header hata di
    let html = "";
    rows.forEach(r=>{
      if(!r.trim()) return;
      const [item, rate, change] = r.split(",").map(s=>s.replace(/"/g,'').trim());
      html += `<div class="card">
        <div><b>${item}</b><br><small style="color:gray">Per Quintal</small></div>
        <div style="text-align:right"><b style="font-size:18px">₹${rate}</b><br><span class="green">${change}</span></div>
      </div>`;
    });
    document.getElementById("bhav-list").innerHTML = html || "Sheet khali hai";
  }catch(e){
    document.getElementById("bhav-list").innerHTML = "Sheet load nahi hui, Publish check karo";
  }
}
loadBhav();
</script>
</body>
</html>
