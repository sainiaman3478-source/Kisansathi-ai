<!-- ROG PEHCHAN CARD - Isko Mandi wale card ke BAAD paste karna hai -->
<div class="mx-4 mt-4 bg-white rounded-[20px] p-5 shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-green-100">
  <div class="flex items-center gap-2 mb-3"><span class="bg-purple-100 p-2 rounded-full">📸</span><h2 class="font-bold text-gray-800">Rog Pehchan - Photo Se</h2></div>
  <p class="text-xs text-gray-500 mb-3">Fasal ki photo lo, AI bimari batayega</p>

  <input type="file" id="rogFile" accept="image/*" capture="environment" onchange="previewRog(event)" class="hidden">
  <label for="rogFile" class="w-full block p-8 border-2 border-dashed border-green-200 rounded-xl text-center bg-green-50/50 cursor-pointer">
    <div id="rogPreviewBox">
      <div class="text-4xl">📷</div>
      <div class="text-sm font-bold mt-2 text-green-700">Photo Lo / Upload Karo</div>
      <div class="text-[11px] text-gray-500">Ganna, Gehu, Tamatar ke patte ki photo</div>
    </div>
    <img id="rogPreviewImg" class="hidden w-full h-48 object-cover rounded-xl mt-2">
  </label>

  <button onclick="askRog()" class="w-full mt-3 bg-purple-600 hover:bg-purple-700 text-white p-4 rounded-xl font-bold shadow-md">🔍 Rog Jaancho</button>
  <div id="rogResult" class="mt-3 p-3 bg-purple-50 rounded-xl text-sm text-purple-900 hidden"></div>
</div>

<script>
function previewRog(e){
  let file = e.target.files[0];
  if(!file) return;
  let img = document.getElementById('rogPreviewImg');
  let box = document.getElementById('rogPreviewBox');
  img.src = URL.createObjectURL(file);
  img.classList.remove('hidden');
  box.classList.add('hidden');
}
