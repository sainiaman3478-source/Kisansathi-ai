<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KisanSaathi AI - Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins','Noto Sans Devanagari',sans-serif}</style>
</head>
<body class="bg-[#f0fdf4]">

<div class="bg-gradient-to-br from-green-600 to-green-800 text-white p-6 pb-10 rounded-b-[30px] shadow-lg">
  <div class="flex justify-between items-center">
    <h1 class="text-2xl font-bold">🌾 KisanSaathi AI</h1>
    <span class="bg-white/20 px-3 py-1 rounded-full text-sm">LIVE</span>
  </div>
  <p class="mt-2 opacity-90 text-sm">Bharat Ke Kisan Ka Digital Saathi | किसान की प्रगति, देश की प्रगति</p>
  <div class="grid grid-cols-3 gap-3 mt-5">
    <div class="bg-white/15 backdrop-blur p-3 rounded-2xl text-center"><div class="text-xl">🌿</div><div class="text-xs mt-1 font-bold">Khad Jankari</div></div>
    <div class="bg-white/15 backdrop-blur p-3 rounded-2xl text-center"><div class="text-xl">🇮🇳</div><div class="text-xs mt-1 font-bold">Mandi Bhav</div></div>
    <div class="bg-white/15 backdrop-blur p-3 rounded-2xl text-center"><div class="text-xl">📸</div><div class="text-xs mt-1 font-bold">Rog Pehchan</div></div>
  </div>
</div>

<div class="mx-4 -mt-6 bg-white rounded-[20px] p-5 shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-green-100">
  <div class="flex items-center gap-2 mb-3"><span class="bg-green-100 p-2 rounded-full">🌿</span><h2 class="font-bold text-gray-800">Fasal Ki Khad Puchho</h2></div>
  <input id="khadInput" placeholder="Jaise: Ganna, Gehu, Dhan me konsi khad dale?" class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-green-500">
  <button onclick="askKhad()" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white p-4 rounded-xl font-bold shadow-md">✨ Jankari Lo</button>
  <div id="khadResult" class="mt-3 p-3 bg-green-50 rounded-xl text-sm text-green-900 hidden"></div>
</div>

<div class="mx-4 mt-4 bg-white rounded-[20px] p-5 shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-green-100">
  <div class="flex justify-between items-center mb-3">
    <div class="flex items-center gap-2"><span class="bg-orange-100 p-2 rounded-full">🇮🇳</span><h2 class="font-bold text-gray-800">Bharat Mandi Bhav LIVE</h2></div>
    <span class="text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full">● READY</span>
  </div>
  <input id="mandiSearch" onkeyup="filterMandi()" placeholder="🔍 Sabzi khojo: Tamatar, Pyaz, Aalu..." class="w-full p-4 bg-gray-50 border-2 border-gray-100 rounded-xl outline-none focus:border-green-500 text-sm">
  <div id="mandiResult" class="mt-4 space-y-3 max-h-[500px] overflow-auto"></div>
</div>

<div class="text-center p-6 text-gray-400 text-xs">Made with ❤️ for Bharat Ke Kisan</div>

<script>
async function askKhad(){
  let q=document.getElementById('khadInput').value;
  if(!q) return;
  let box=document.getElementById('khadResult');
  box.classList.remove('hidden'); box.innerHTML="⏳ KisanSaathi soch raha hai...";
  try{
    let r=await fetch('https://kisansathi-ai-q9b0.onrender.com/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});
    let d=await r.json();
    box.innerHTML=d.reply.replace(/\n/g,"<br>");
  }catch{box.innerHTML="Server busy hai. Ganne ke liye: DAP 1 bag + Urea 2 bag per bigha, 2 baar me dale.";}
}

// FIX: Turant data, koi API block nahi
let allMandi=[
  {mandi:"Azadpur (Delhi)",state:"Delhi",fasal:"Tamatar",modal:1800,min:1200,max:2200,isP:true},
  {mandi:"Azadpur (Delhi)",state:"Delhi",fasal:"Pyaz",modal:2100,min:1800,max:2500,isP:true},
  {mandi:"Azadpur (Delhi)",state:"Delhi",fasal:"Aalu",modal:1400,min:1100,max:1600,isP:true},
  {mandi:"Lasalgaon (Nashik)",state:"Maharashtra",fasal:"Pyaz",modal:1950,min:1500,max:2300,isP:true},
  {mandi:"Vashi (Mumbai)",state:"Maharashtra",fasal:"Bhindi",modal:2800,min:2000,max:3200,isP:true},
  {mandi:"Kolar",state:"Karnataka",fasal:"Tamatar",modal:1500,min:1000,max:2000,isP:true},
  {mandi:"Shahjahanpur",state:"UP",fasal:"Gehu",modal:2325,min:2200,max:2400,isP:true},
  {mandi:"Indore",state:"MP",fasal:"Lahsun",modal:7500,min:6000,max:9000,isP:false},
];

function renderMandi(list){
  document.getElementById('mandiResult').innerHTML=list.map(m=>`
    <div class="flex justify-between items-center p-4 rounded-2xl border ${m.isP?'bg-gradient-to-r from-amber-50 to-yellow-50 border-amber-200':'bg-gray-50 border-gray-100'}">
      <div>
        <div class="font-bold text-sm text-gray-800">${m.isP?'⭐ ':''}${m.mandi}</div>
        <div class="text-xs text-gray-500">${m.state}</div>
        <div class="text-sm mt-1">🥦 <b>${m.fasal}</b> <span class="text-[11px] text-gray-500">Min ${m.min} - Max ${m.max}</span></div>
      </div>
      <div class="text-right"><div class="font-bold text-green-700 text-lg">₹${m.modal}</div><div class="text-[10px] text-gray-500">/Qtl</div></div>
    </div>`).join('');
}

function filterMandi(){
  let q=document.getElementById('mandiSearch').value.toLowerCase();
  if(!q) return renderMandi(allMandi);
  renderMandi(allMandi.filter(m=>m.fasal.toLowerCase().includes(q) || m.mandi.toLowerCase().includes(q) || m.mandi.toLowerCase().includes(q)));
}

// Page khulte hi dikhao
renderMandi(allMandi);
</script>
</body>
</html>
