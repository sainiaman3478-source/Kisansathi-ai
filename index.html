<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kisan Saathi AI</title>
  <style>
    body { background:#f1f8e9; margin:0; padding:0; font-family: sans-serif; }
    #lakdi-mandi-SAFE { max-width: 420px; margin: 10px auto; background: white; border-radius: 18px; padding: 16px; border: 2px solid #ff9800; border-left: 5px solid #ff6d00; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
  </style>
</head>
<body>

  <div id="lakdi-mandi-SAFE">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0; color:#e65100; font-size:17px;">🪵 लकड़ी मंडी भाव</h2>
      <span style="background:#fff3e0; color:#e65100; padding:4px 10px; border-radius:15px; font-size:11px; font-weight:bold;">LIVE • Sheet से</span>
    </div>
    <p style="margin:5px 0; color:gray; font-size:12px;">📍 Yamunanagar Mandi • <span id="lakdiDate"></span> • <span id="updateTime" style="color:green; font-weight:bold;">LIVE</span></p>
    <div style="font-size:32px; font-weight:900; color:#0a4d1e; margin-top:8px;" id="mainRate">₹ -- / क्विंटल</div>
    <p style="font-size:12px; background:#e8f5e9; display:inline-block; padding:4px 8px; border-radius:6px; margin:5px 0;" id="mainItem">Loading LIVE...</p>
    <div class="grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
      <button onclick="document.getElementById('lakdiDetailPage').style.display='block'" style="background:#ff6d00; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">पूरा भाव देखें</button>
      <a href="https://docs.google.com/forms/d/e/1FAIpQLSdEMLnStwzgQ0Zgcwi2ENb4J4LUio-mH9U-jSExf2Z_XzWzcw/viewform" target="_blank" style="text-decoration:none;"><button style="width:100%; background:#0a8a3a; color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">🌳 लकड़ी बेचें</button></a>
    </div>
  </div>

  <div id="root"></div>

  <div id="lakdiDetailPage" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#f6fff6; z-index:9999; overflow:auto;">
    <div style="background:#0a8a3a; color:white; padding:15px 20px; display:flex; align-items:center; gap:15px; position:sticky; top:0;">
      <button onclick="document.getElementById('lakdiDetailPage').style.display='none'" style="background:rgba(255,255,255,0.2); border:none; color:white; font-size:20px; width:35px; height:35px; border-radius:50%;">←</button>
      <h2 style="margin:0; font-size:17px;">लकड़ी मंडी भाव - LIVE</h2>
    </div>
    <div style="padding:20px; max-width:420px; margin:0 auto;"><div id="bhav-list">Loading...</div></div>
  </div>

  <!-- 1. PEHLE TERA REAL APP LOAD HOGA - LOCATION SAHI RAHEGA -->
  <script type="module" src="./main.tsx"></script>

  <!-- 2. USKE BAAD LAKDI WALA BHAV LOAD HOGA -->
  <script>
    document.getElementById("lakdiDate").innerText = new Date().toLocaleDateString('hi-IN', {day:'numeric', month:'long'});
    const SHEET_ID = "1HbtQAFCUWaoP3C6RSIGpw8E0p3tvf7mkSR0rY7mByDk";
    const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Sheet1`;
    async function loadBhav(){
      try{
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const rows = text.split("\n").slice(1).filter(r=>r.trim()!="");
        if(rows.length > 0){
          const firstRow = rows[0].split(",").map(s=>s.replace(/"/g,'').trim());
          document.getElementById("mainItem").innerText = "🍃 " + firstRow[0];
          document.getElementById("mainRate").innerText = "₹ " + firstRow[1] + " / क्विंटल";
          document.getElementById("updateTime").innerText = "LIVE " + new Date().toLocaleTimeString('hi-IN');
        }
        let html = "";
        rows.forEach(r=>{
          const [item, rate, change] = r.split(",").map(s=>s.replace(/"/g,'').trim());
          html += `<div style="background:white; border:1.5px solid #a5d6a7; padding:14px; border-radius:12px; margin:10px 0; display:flex; justify-content:space-between;"><div><b>${item}</b></div><div><b>₹${rate}</b> <small style="background:#e8f5e9; padding:2px 6px; border-radius:8px;">${change||''}</small></div></div>`;
        });
        document.getElementById("bhav-list").innerHTML = html;
      }catch(e){ document.getElementById("bhav-list").innerHTML = "Sheet Publish check karo"; }
    }
    // Thoda delay se chalao taaki location pehle load ho jaye
    setTimeout(loadBhav, 1500);
  </script>
</body>
</html>
